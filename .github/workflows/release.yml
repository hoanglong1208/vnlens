name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Test
        run: uv run pytest
      - name: Build executable
        run: uv run python build.py
      - name: Rename artifact with version
        shell: pwsh
        run: Copy-Item dist/VNLens.exe "dist/VNLens-${{ github.ref_name }}.exe"
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/VNLens-${{ github.ref_name }}.exe"
          --title "VNLens ${{ github.ref_name }}"
          --generate-notes
